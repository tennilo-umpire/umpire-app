name: TENNILO Umpire manuell veröffentlichen

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tennilo-umpire-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Scoring prüfen und Dateien per FTPS veröffentlichen
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Repository abrufen
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node-Scoring-Tests
        run: node --test tests/*.test.mjs
      - name: Dateiliste prüfen
        shell: bash
        run: |
          set -euo pipefail
          test -s deploy-files.txt
          count=0
          while IFS= read -r file || [[ -n "$file" ]]; do
            [[ "$file" =~ ^public/[A-Za-z0-9._/-]+$ ]] || { echo "::error::Ungültiger Dateipfad"; exit 1; }
            [[ "$file" != *..* ]] || { echo "::error::Nicht zulässiger Dateipfad"; exit 1; }
            test -s "$file" || { echo "::error::Leere/fehlende Datei: $file"; exit 1; }
            count=$((count+1))
          done < deploy-files.txt
          test "$count" -eq 8
      - name: Ausschließlich freigegebene Dateien per FTPS übertragen
        shell: bash
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          : "${FTP_HOST:?FTP_HOST fehlt als Repository-Secret}"
          : "${FTP_USER:?FTP_USER fehlt als Repository-Secret}"
          : "${FTP_PASSWORD:?FTP_PASSWORD fehlt als Repository-Secret}"
          # FTP-Benutzer startet direkt im DocumentRoot von umpire.tennilo.de.
          while IFS= read -r file || [[ -n "$file" ]]; do
            remote="${file#public/}"
            echo "Übertrage $remote"
            curl --fail --silent --show-error --ssl-reqd --ftp-pasv --ftp-create-dirs \
              --user "${FTP_USER}:${FTP_PASSWORD}" \
              --upload-file "$file" \
              "ftp://${FTP_HOST}:21/$remote"
          done < deploy-files.txt
          echo "TENNILO Umpire erfolgreich per FTPS übertragen."
